name: CI

on:
  push:
    branches: ["master"]
  pull_request:

# Nothing here writes to the repository: the job only builds and tests.
permissions:
  contents: read

jobs:
  test:
    # Kept in step with the release job: tests have to run against the same
    # SDK the shipped binary is linked against.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version && xcrun --show-sdk-version

      - name: Check formatting
        run: make lint

      - name: Run unit tests
        run: make test

      - name: Build release configuration
        run: make build
