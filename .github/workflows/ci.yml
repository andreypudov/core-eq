name: CI

on:
  push:
    branches: ["master"]
  pull_request:

# Nothing here writes to the repository: the job only builds and tests.
permissions:
  contents: read

jobs:
  test:
    # Kept in step with the release job: tests have to run against the same
    # SDK the shipped binary is linked against. `xcode-27` rather than
    # `macos-27` — GitHub has no GA macOS 27 image, and `macos-latest` still
    # resolves to the macOS 26 one. See docs/RELEASING.org.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version && xcrun --show-sdk-version

      - name: Check formatting
        run: make lint

      - name: Run unit tests
        run: make test

      # The fallback for a macOS without TCC's private entry points. Nothing
      # else compiles it, and the grep fails the job if the private names
      # leak back into a build that promises not to contain them.
      - name: Build without private TCC API
        run: |
          make build XCODE_FLAGS="ARCHS=arm64 COREEQ_TCC_SPI=NO"
          if strings build/Release/CoreEQ.app/Contents/MacOS/CoreEQ | grep -q TCCAccess; then
            echo "::error::private TCC names found in a COREEQ_TCC_SPI=NO build"
            exit 1
          fi

      - name: Build release configuration
        run: make build
