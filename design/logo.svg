<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Solid background color -->
    <style>
      .bg { fill: #29ac49; }
      .bar { fill: #ffffff; }
    </style>

    <!-- Very subtle down-right shadow -->
    <filter id="barShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="5" dy="7" stdDeviation="7" flood-color="rgba(0,0,0,0.10)" />
    </filter>
  </defs>

  <!-- Rounded square background, full bleed: macOS masks the icon into the
       system shape itself, so the artwork must cover the whole canvas -->
  <rect
    x="0"
    y="0"
    width="1024"
    height="1024"
    rx="229"
    class="bg"
  />

  <!-- EQ bars with subtle shadow, scaled up to match the full-bleed field -->
  <g filter="url(#barShadow)" transform="translate(512 512) scale(1.143) translate(-512 -512)">
    <!-- Left smallest bar (shorter & wider) -->
    <rect
      x="270"
      y="360"
      width="70"
      height="300"
      rx="16"
      class="bar"
    />

    <!-- Medium bar -->
    <rect
      x="380"
      y="280"
      width="70"
      height="450"
      rx="16"
      class="bar"
    />

    <!-- Tallest bar -->
    <rect
      x="490"
      y="200"
      width="70"
      height="620"
      rx="16"
      class="bar"
    />

    <!-- Medium-high bar -->
    <rect
      x="600"
      y="280"
      width="70"
      height="450"
      rx="16"
      class="bar"
    />

    <!-- Right smallest bar (shorter & wider) -->
    <rect
      x="710"
      y="360"
      width="70"
      height="300"
      rx="16"
      class="bar"
    />
  </g>
</svg>
