<svg width="510" height="620" viewBox="270 200 510 620" xmlns="http://www.w3.org/2000/svg">
  <!-- menubar.svg struck through: CoreEQ is not processing audio.

       The same five bars, at the same heights. The curve is the icon's
       identity, so the shape is left alone and only the slash carries the
       meaning.

       The slash follows the SF Symbols treatment, measured off bell.slash:
       45 degrees, top-left to bottom-right, a stroke about 7% of the glyph
       width, and a transparent gap either side of roughly the same width.
       The gap is not decoration. A menu bar icon is a template image, drawn
       from its alpha channel alone, so a black slash laid over black bars
       would be invisible; the gap is the only thing that separates them.

       Each bar is the *rounded* bar clipped against the gap, not a sharp one
       clipped and then rounded — a cut landing near a corner has to truncate
       that corner's curve, not replace it with a tighter one. Corners are
       identical to menubar.svg; only the cut edges are straight. Paths rather
       than rects behind a mask because the renderer `make icons` falls back to
       supports neither masks nor strokes. Re-derive if menubar.svg changes. -->
