<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Solid background color -->
    <style>
      .bg { fill: #29ac49; }
      .bar { fill: #ffffff; }
    </style>

    <!-- Very subtle down-right shadow -->
    <filter id="barShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="5" dy="7" stdDeviation="7" flood-color="rgba(0,0,0,0.10)" />
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect
    x="64"
    y="64"
    width="896"
    height="896"
    rx="220"
    class="bg"
  />

  <!-- EQ bars with subtle shadow -->
  <g filter="url(#barShadow)">
    <!-- Left smallest bar (shorter & wider) -->
    <rect
      x="270"
      y="360"
      width="70"
      height="300"
      rx="16"
      class="bar"
    />

    <!-- Medium bar -->
    <rect
      x="380"
      y="280"
      width="70"
      height="450"
      rx="16"
      class="bar"
    />

    <!-- Tallest bar -->
    <rect
      x="490"
      y="200"
      width="70"
      height="620"
      rx="16"
      class="bar"
    />

    <!-- Medium-high bar -->
    <rect
      x="600"
      y="280"
      width="70"
      height="450"
      rx="16"
      class="bar"
    />

    <!-- Right smallest bar (shorter & wider) -->
    <rect
      x="710"
      y="360"
      width="70"
      height="300"
      rx="16"
      class="bar"
    />
  </g>
</svg>
